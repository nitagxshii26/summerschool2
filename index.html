<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Store - Premium Gaming Gear</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Gaming Store</h1>
    </header>

    <main>
      <div class="products-grid">
        <div class="product-card" data-id="1">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&amp;h=300&amp;fit=crop" alt="Gaming Headphones">
          <h2>Gaming Headphones</h2>
          <p class="price">$129.99</p>
          <button class="view-btn">View Details</button>
        </div>

        <div class="product-card" data-id="2">
          <img src="https://media.s-bol.com/NJ1WEGQpzGoz/P1oEEVl/550x485.jpg" alt="Mechanical Mouse">
          <h2>Mechanical Mouse</h2>
          <p class="price">$79.99</p>
          <button class="view-btn">View Details</button>
        </div>

        <div class="product-card" data-id="3">
          <img src="https://tse3.mm.bing.net/th/id/OIP.kNm24ee63u-potrblD4RigHaHa?rs=1&amp;pid=ImgDetMain&amp;o=7&amp;rm=3" alt="Ergonomic Chair">
          <h2>Ergonomic Chair</h2>
          <p class="price">$349.99</p>
          <button class="view-btn">View Details</button>
        </div>

        <div class="product-card" data-id="4">
          <img src="https://tse2.mm.bing.net/th/id/OIP.6BwYSH6cXImvPZH6z49SRwHaFG?rs=1&amp;pid=ImgDetMain&amp;o=7&amp;rm=3" alt="4K Gaming Monitor">
          <h2>4K Gaming Monitor</h2>
          <p class="price">$599.99</p>
          <button class="view-btn">View Details</button>
        </div>
      </div>
    </main>
  <section class="chat-section">
    <h2>Ask a Question</h2>
    <input type="text" id="user-question" placeholder="Ask about products...">
    <button id="ask-btn">Submit</button>
    <div id="ai-response"></div>
  </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
